#
# Enables GitHub's native auto-merge on Dependabot patch- and minor-version
# update PRs. Major updates are deliberately left alone — they're more likely
# to introduce breaking changes and warrant a human glance at the upstream
# release notes before merging.
#
# Why this exists: the project's PR gate — CI green + a Claude Code review +
# Steve's explicit approval — has a manual step, so Dependabot PRs would
# otherwise block on it forever. Routine patch/minor bumps are exactly the kind
# of low-risk change that should ship on green CI alone.
#
# Mechanism: this fires on `pull_request_target` (which runs with the base
# branch's secrets and the GITHUB_TOKEN's default repository write scopes —
# safer than `pull_request` for actions that need write access). The
# `dependabot/fetch-metadata` action parses the Dependabot PR body for the
# `update-type` semver classification; only patch and minor pass the filter.
# `gh pr merge --auto --squash` enables GitHub's native auto-merge, which
# holds the PR until every required status check goes green, then squashes
# (matching the repo's squash-only policy).
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on PRs Dependabot opened. A non-bot author with the literal
    # string "dependabot[bot]" as their username is impossible — that suffix
    # is reserved for GitHub Apps' installation actors.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub's `--auto` merges IMMEDIATELY when the base branch has no
      # required status checks — there is nothing for auto-merge to wait for,
      # so "auto-merge once CI is green" silently degrades to "merge now,
      # CI still running" (#209 item 2). Gate on the base branch actually
      # having required checks, and fail CLOSED: if the protection summary
      # is unreadable or lists none, auto-merge stays off.
      - name: Check base branch has required status checks
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/branches/$BASE" \
                --jq '[.protection.required_status_checks.checks[]?] | length' \
                2>/dev/null || echo 0)
          echo "required-checks=${n:-0}" >> "$GITHUB_OUTPUT"
          echo "base '$BASE' has ${n:-0} required status check(s)"

      - name: Enable auto-merge (patch / minor only)
        if: |
          steps.gate.outputs.required-checks != '0' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Note why auto-merge was skipped (no required checks on base)
        if: |
          steps.gate.outputs.required-checks == '0' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Auto-merge skipped: the base branch has **no required status \
            checks**, so GitHub's auto-merge would merge immediately instead \
            of waiting for CI. Merge manually after CI is green, or make the \
            CI checks required on this branch to re-enable auto-merge. \
            (see .github/workflows/dependabot-auto-merge.yml)"

      - name: Note that majors are left for a human
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Auto-merge skipped: this is a **major-version** update. \
            A human reviewer should glance at the upstream release notes \
            before merging. (Patch and minor updates auto-merge once CI \
            is green; see .github/workflows/dependabot-auto-merge.yml.)"
