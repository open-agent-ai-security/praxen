#
# Guard against drift between this repo's legacy marketplace mirror
# (.claude-plugin/marketplace.json) and the canonical community index at
# https://github.com/open-agent-ai-security/plugins. The weekly run catches
# canonical-side edits that no PR here would ever trigger on.
name: marketplace-mirror-sync

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "scripts/release/check_marketplace_mirror.py"
      - ".github/workflows/marketplace-sync.yml"
  push:
    branches: [dev, main]
    paths:
      - ".claude-plugin/**"
      - "scripts/release/check_marketplace_mirror.py"
      - ".github/workflows/marketplace-sync.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare mirror against canonical index
        run: python3 scripts/release/check_marketplace_mirror.py
