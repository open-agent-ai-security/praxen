# Dependabot keeps the GitHub Actions in .github/workflows/ current.
# Praxen's runtime is stdlib-only Python — there is no language ecosystem
# (pip / npm / go modules / etc.) for Dependabot to track. The only thing
# this repo pulls from a registry is GitHub Actions, so that is the only
# ecosystem configured here. If we ever take a Python (or other) runtime
# dependency, add a second update block.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    # Target `dev`, not the default branch. `main` is the release channel and
    # must stay an ancestor of `dev` (enforced by branch-drift.yml); a PR
    # merged straight to `main` puts a commit there that `dev` lacks and breaks
    # that invariant — and the next dev→main promotion inherits the mess.
    # Without this, Dependabot defaults to the default branch (`main`), which
    # is how #193 came to target the release channel.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Bundle minor + patch updates into one PR per week; majors stay
      # separate so a breaking-change review isn't lost in the noise.
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
